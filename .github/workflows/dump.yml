on:
  workflow_dispatch: 

name: Dump release

jobs:
  updateDataAndRelease:
    name: Dump Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Chmod
        run: chmod +x ./script/release.sh
      - name: Dump
        run: npm run dump
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
