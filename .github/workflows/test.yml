name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: "npm install"
      - name: Run tests
        run: "npm test"
